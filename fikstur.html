/* Layout: one narrow column, a "çubuklu" striped band on top, the next match as the single heavy card, then a month-grouped fixture list. */
:root{
  --bg:#f6f6f4; --surface:#ffffff; --ink:#111214; --muted:#5f6166; --line:#dcdcd8;
  --stripe-a:#111214; --stripe-b:#ffffff; --accent:#c8102e; --ok:#1d6b45; --chip:#ececE8;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e0f11; --surface:#17181b; --ink:#f2f2f0; --muted:#a2a4a9; --line:#2b2d31;
  --stripe-a:#f2f2f0; --stripe-b:#0e0f11; --accent:#ff4d5e; --ok:#5cc28d; --chip:#222428; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e0f11; --surface:#17181b; --ink:#f2f2f0; --muted:#a2a4a9; --line:#2b2d31;
  --stripe-a:#f2f2f0; --stripe-b:#0e0f11; --accent:#ff4d5e; --ok:#5cc28d; --chip:#222428; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
.stripes{height:10px;background:repeating-linear-gradient(90deg,var(--stripe-a) 0 14px,var(--stripe-b) 14px 28px);border-bottom:1px solid var(--line)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 48px;display:flex;flex-direction:column;gap:22px}
h1{font-family:var(--display);font-weight:800;font-size:30px;letter-spacing:.02em;text-transform:uppercase;margin:0;text-wrap:balance}
h2{font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0}
.sub{color:var(--muted);margin:2px 0 0;font-size:14px}
.next{background:var(--ink);color:var(--bg);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px}
.next .lbl{font-family:var(--display);letter-spacing:.14em;text-transform:uppercase;font-size:13px;opacity:.75}
.next .teams{font-family:var(--display);font-weight:800;font-size:30px;line-height:1.05;text-transform:uppercase;text-wrap:balance}
.next .when{font-size:15px;opacity:.9}
.count{display:flex;gap:14px;font-variant-numeric:tabular-nums}
.count div{display:flex;flex-direction:column}
.count b{font-family:var(--display);font-size:34px;font-weight:800;line-height:1}
.count span{font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.7}
.next a.btn{align-self:flex-start;background:var(--bg);color:var(--ink)}
.month{display:flex;flex-direction:column;gap:8px}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:grid;grid-template-columns:56px 1fr;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.date{display:flex;flex-direction:column;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.date b{font-family:var(--display);font-weight:800;font-size:26px;line-height:1}
.date span{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.info{min-width:0;display:flex;flex-direction:column;gap:4px}
.vs{font-weight:600;font-size:16px}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.chip{background:var(--chip);color:var(--ink);border-radius:999px;padding:1px 8px;font-size:12px;font-weight:500}
.chip.uel{background:transparent;border:1px solid var(--ink)}
.chip.derby{background:var(--accent);color:#fff}
.tbd{color:var(--accent);font-weight:500}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.btn{font:inherit;font-size:13px;font-weight:600;border-radius:8px;padding:6px 11px;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none;cursor:pointer}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.danger{color:var(--accent);border-color:var(--accent)}
.btn:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
form.edit{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
form.edit label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);min-width:0}
form.edit .full{grid-column:1/-1}
input,select{font:inherit;font-size:15px;padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);min-width:0;width:100%;box-sizing:border-box}
.note{font-size:13px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.note p{margin:0}
.note.warn{border-color:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:999px;font-size:14px}
details summary{cursor:pointer;font-weight:600;color:var(--ink)}
@media (prefers-reduced-motion:no-preference){.row{transition:background .15s}}

(function(){
  var COMP = {SL:"Süper Lig", UEL:"Avrupa Ligi", TK:"Türkiye Kupası", OT:"Diğer"};
  var MONTHS = ["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];

    return "https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent("⚽ "+vs(m))+"&dates="+dates+"&details="+encodeURIComponent(details)+"&ctz=Europe/Istanbul";

  function upcoming(){

  function undated(){ return state.matches.filter(function(m){return !m.date;}); }

  function editForm(m){
    return '<form class="edit" data-id="'+esc(m.id)+'">'+

      '<label>Tarih<input id="f-date-'+esc(m.id)+'" type="date" name="date" value="'+esc(m.date||"")+'"></label>'+
      '<label>Saat (TSİ)<input id="f-time-'+esc(m.id)+'" type="time" name="time" value="'+esc(m.time||"")+'"></label>'+
      '<label>Saha<select id="f-home-'+esc(m.id)+'" name="home"><option value="1"'+(m.home?" selected":"")+'>İç saha</option><option value="0"'+(m.home?"":" selected")+'>Deplasman</option></select></label>'+

  function tick(){
    var el = document.getElementById("count"), m = upcoming()[0];

    up.forEach(function(m){ var p = trParts(kickoff(m)), key = MONTHS[p.mo]+" "+p.y; if(!cur || cur.key!==key){ cur = {key:key, items:[]}; groups.push(cur);} cur.items.push(m); });

    var h = '<header><h1>Kartal Maç Takvimi</h1><p class="sub">Beşiktaş A takımının kalan maçları · saatler Türkiye saati</p></header>';

    if(und.length) h += '<section class="month"><h2>Tarihi açıklanmayanlar · '+und.length+' maç</h2><div class="list">'+und.map(row).join("")+'</div></section>';
    h += '<section class="month"><h2>Maç ekle</h2><div class="list">'+(newM ? '<div class="row"><div class="date"><b>+</b><span>yeni</span></div><div class="info">'+editForm(newM)+'</div></div>' : '<div class="row"><div class="date"><b>+</b><span>yeni</span></div><div class="info"><div class="vs">Kupa, play-off veya hazırlık maçı</div><div class="actions"><button class="btn primary" data-act="add">Maç ekle</button></div></div></div>')+'</div></section>';
    h += '<div class="note"><p><b>Hatırlatma telefon takviminden gelir.</b> Tüm sezonu bir kerede eklemek için sana gönderilen <b>besiktas-maclar.ics</b> dosyasını aç; her maça 1 gün ve 1 saat önce alarm kurulu. Saati sonradan açıklanan maçları buradan güncelle ve <b>Takvime ekle</b> ile tekrar ekle.</p>'+

    app.innerHTML = '<div class="stripes"></div><div class="wrap">'+h+'</div>';

  function serialize(){

    var json = JSON.stringify(state).replace(/</g,"\\u003c");

  }

  app.addEventListener("click", function(ev){
    var b = ev.target.closest("[data-act]"); if(!b) return;

    }
  });
  app.addEventListener("submit", function(ev){
    ev.preventDefault();
    var f = ev.target, id = f.getAttribute("data-id"), fd = new FormData(f);

    if(!m){ m = {id:id}; state.matches.push(m); }
    m.opp = opp; m.date = fd.get("date") || null; m.time = m.date && fd.get("time") ? fd.get("time") : null;

  });

  render();
  timer = setInterval(tick, 30000);
  (window.claude && window.claude.use ? window.claude.use("artifact") : Promise.resolve(null)).then(function(a){
    if(a){ artifact = a; mode = "shared"; return; }
    mode = "local";
    try{ var s = JSON.parse(localStorage.getItem(LS_KEY)||"null"); if(s && s.rev > state.rev) state = s; }catch(e){}
