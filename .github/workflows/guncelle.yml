name: Takvimi güncelle

on:
  schedule:
    - cron: "17 5,11,17 * * *"  # Günde 3 kez (TSİ 08:17, 14:17, 20:17)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: guncelle
  cancel-in-progress: false

jobs:
  guncelle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 update.py
      - name: Değişiklik varsa kaydet
        run: |
          if git diff --quiet -- besiktas.ics; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add besiktas.ics
          git commit -m "Takvim güncellendi"
          git push
